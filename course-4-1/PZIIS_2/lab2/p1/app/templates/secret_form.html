{% extends "base.html" %}
{% block title %}{% if secret %}Изменить секрет{% else %}Новый секрет{% endif %}{% endblock %}
{% block content %}
<h1>{% if secret %}Редактирование секрета{% else %}Новый секрет{% endif %}</h1>
<form method="post" class="card">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label>Заголовок
    <input name="title" required maxlength="200" value="{{ secret.title if secret else '' }}">
  </label>
  <label>Конфиденциальный текст
    <textarea name="body" rows="8">{{ body }}</textarea>
  </label>
  <button type="submit">Сохранить</button>
</form>
{% endblock %}
